name: Build and test

"on":
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a Release
        type: boolean
        required: true
        default: false
      release_name:
        description: Release name (optional, used when publishing)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install compilers and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 shellcheck zip

      - name: Check shell scripts
        run: shellcheck deploy.sh scripts/package.sh tests/run.sh

      - name: Build and run synthetic tests
        run: make test

      - name: Package source and binaries
        run: make package

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hbr-open-launcher-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish Release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hbr-open-launcher-linux-x86_64
          path: dist

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          title="${RELEASE_NAME:-HBR Open Launcher build ${GITHUB_RUN_NUMBER}}"
          gh release create "$tag" dist/* \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --generate-notes
